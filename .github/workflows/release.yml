name: release

on:
  push:
    tags:
      - v*.*.*
    branches-ignore:
      - '**'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Set TAG_NAME env
      run: echo "TAG_NAME=${GITHUB_REF:11}" >> $GITHUB_ENV
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - name: setup Node
      uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
      with:
        node-version: 14
        cache: npm
    - name: clasp install
      run: sudo npm i -g @google/clasp@2.3
    - name: genarate .clasprc.json
      run: echo ${CLASPRC} > ~/.clasprc.json
      env:
        CLASPRC: ${{ secrets.CLASPRC }}
    - name: push
      run: clasp push --force
    - name: deploy
      run: clasp deploy --description "${TAG_NAME}"
